## A. PROMPT CÓ CẤU TRÚC (dán vào AI để sinh web)

**1. Role (Vai trò):** Bạn là lập trình viên web full-stack kiêm chuyên gia nghiệp vụ, có hơn 10 năm làm phần mềm cho gara ô tô tại Việt Nam, viết code sạch và giao diện dễ dùng cho người không rành công nghệ.

**2. Context (Bối cảnh):** Gara quy mô vừa (5 đến 10 nhân viên) đang ghi sổ tay và Excel nên hay nhầm tồn kho và thất lạc phiếu sửa chữa. Đây là bản demo môn học, cần web chạy ngay trên trình duyệt, có link công khai, không cần máy chủ. Tiền tệ VND, VAT 10%, biển số dạng 43A-123.45.

**3. Task (Nhiệm vụ):** Xây web quản lý gara gồm:
1. Tổng quan: xe đang trong gara, phiếu chờ thanh toán, doanh thu tháng, phụ tùng sắp hết, biểu đồ doanh thu 6 tháng.
2. Khách hàng và Xe: thêm, tìm kiếm, xóa (xe gồm biển số, hãng, dòng, năm, số km, chủ xe).
3. Phiếu sửa chữa: tạo phiếu, thêm dịch vụ và phụ tùng, 4 trạng thái (Tiếp nhận, Đang sửa, Hoàn thành, Đã thanh toán), tự tính VAT và tổng cộng.
4. Kho phụ tùng: tồn kho, mức tối thiểu, nhập thêm, tự trừ kho khi thêm vào phiếu và hoàn lại khi bỏ ra, cảnh báo sắp hết.
5. Hóa đơn: danh sách phiếu đã thanh toán, xem chi tiết, tổng doanh thu.
6. Có dữ liệu mẫu thực tế để mở lên là thấy cách hoạt động.

**4. Constraints (Ràng buộc):**
- ĐƯỢC: HTML, CSS, JavaScript thuần trong một trang; lưu bằng localStorage; giao diện tiếng Việt có dấu; dùng tốt trên điện thoại và máy tính; kiểm tra dữ liệu nhập (biển số không trùng, số lượng lớn hơn 0, không bán quá tồn kho).
- KHÔNG ĐƯỢC: dùng framework hay thư viện ngoài; dùng alert, confirm, prompt; xóa khách hàng đang có xe hoặc xe đã có phiếu; bịa tính năng thanh toán online hay SMS; dùng lorem ipsum.

**5. Output Format (Định dạng):** Trả về một file HTML hoàn chỉnh chạy được ngay. Menu tab ở đầu trang, dữ liệu dạng bảng, trạng thái dạng nhãn màu, tiền dạng 1.250.000 ₫. Sau code, viết tối đa 5 dòng hướng dẫn dùng và giới hạn đã biết.

---

## B. SO SÁNH: PROMPT ĐƠN GIẢN và PROMPT CÓ CẤU TRÚC

**Prompt đơn giản:** "Làm cho tôi một web quản lý gara ô tô."

| Tiêu chí | Prompt đơn giản | Prompt có cấu trúc |
|---|---|---|
| Chức năng | AI tự đoán, thường chỉ có bảng xe và form thêm xe | Đủ 6 module đúng nghiệp vụ |
| Nghiệp vụ Việt Nam | Thiếu VAT, biển số, VND | Có VAT 10%, biển số, định dạng VND |
| Kho phụ tùng | Hay bỏ qua hoặc không liên kết với phiếu | Tự trừ và hoàn kho, cảnh báo sắp hết |
| Kỹ thuật | Hay cần framework hoặc backend nên khó chạy ngay | Một file HTML, chạy và publish được |
| Giao diện | Chung chung, lẫn tiếng Anh | Tiếng Việt, dùng được trên điện thoại |
| Kiểm tra dữ liệu | Ít | Có ràng buộc rõ |
| Số lần chỉnh sửa | Nhiều vòng hỏi lại | Ít, dùng được ngay |

Nhận xét: prompt đơn giản để AI tự điền chỗ trống nên kết quả khác nhau mỗi lần; prompt có cấu trúc thu hẹp khoảng trống nên ổn định và dễ đối chiếu barem.

## C. ĐÁNH GIÁ và TỐI ƯU (Prompt Refinement)

**Kinh nghiệm rút ra**
1. Nêu rõ người dùng và quy mô để AI chọn mức phức tạp vừa đủ.
2. Liệt kê chức năng theo danh sách đánh số, dễ đối chiếu hơn đoạn văn.
3. Ràng buộc có cả "được" và "không được" giúp giảm lỗi lặt vặt.
4. Chỉ rõ định dạng đầu ra (một file HTML) để chạy được ngay.
5. Dữ liệu mẫu thực tế giúp người chấm hiểu phần mềm nhanh.

**Có thể cải thiện:** phân quyền (chủ gara, cố vấn, thợ); lịch hẹn và nhắc bảo dưỡng theo số km; xuất hóa đơn PDF; cơ sở dữ liệu thật để nhiều máy dùng chung.

  /* ---------- modal ---------- */
  function openModal(title,body,onSubmit,label){
    var m=document.getElementById('modal');
    m.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2><form id="mform">'+body+

    f.addEventListener('submit',function(e){
      e.preventDefault();
      var data={};new FormData(f).forEach(function(v,k){data[k]=String(v).trim()});

  function fld(name,label,opts){
    opts=opts||{};
    var attrs=' id="f-'+name+'" name="'+name+'"'+(opts.req!==false?' required':'')+(opts.val!=null?' value="'+esc(opts.val)+'"':'')+(opts.type?' type="'+opts.type+'"':'')+(opts.min!=null?' min="'+opts.min+'"':'')+(opts.ph?' placeholder="'+esc(opts.ph)+'"':'');
    return '<label for="f-'+name+'">'+label+'<input'+attrs+'></label>';
  }
  function sel(name,label,options,val){
    return '<label for="f-'+name+'">'+label+'<select id="f-'+name+'" name="'+name+'" required>'+options.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===val?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select></label>';

  function monthKey(iso){var d=new Date(iso);return d.getFullYear()+'-'+(d.getMonth()+1)}

  function rDash(){
    var active=S.orders.filter(function(o){return o.status==='tiepnhan'||o.status==='dangsua'});
    var waiting=S.orders.filter(function(o){return o.status==='hoanthanh'});
    var now=new Date();var mk=now.getFullYear()+'-'+(now.getMonth()+1);
    var rev=S.orders.filter(function(o){return o.status==='dathanhtoan'&&monthKey(o.paidAt)===mk}).reduce(function(a,o){return a+total(o)},0);
    var low=S.parts.filter(function(p){return p.stock<=p.min});
    var months=[];
    for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.getFullYear()+'-'+(d.getMonth()+1),label:'T'+(d.getMonth()+1),sum:0})}
    S.orders.forEach(function(o){if(o.status==='dathanhtoan'){var m=months.filter(function(x){return x.key===monthKey(o.paidAt)})[0];if(m)m.sum+=total(o)}});
    var mx=Math.max.apply(null,months.map(function(m){return m.sum}).concat([1]));
    var h='<div class="tiles">'+
      '<div class="tile"><div class="k">Xe đang trong gara</div><div class="v">'+active.length+'</div></div>'+
      '<div class="tile"><div class="k">Chờ thanh toán</div><div class="v">'+waiting.length+'</div></div>'+
      '<div class="tile"><div class="k">Doanh thu tháng này</div><div class="v">'+fmt(rev)+'</div></div>'+
      '<div class="tile"><div class="k">Phụ tùng sắp hết</div><div class="v'+(low.length?' warn':'')+'">'+low.length+'</div></div></div>';
    h+='<div class="grid2"><section class="panel"><h3>Xe đang xử lý</h3>';
    var cur=active.concat(waiting);
    if(!cur.length)h+='<div class="empty">Gara đang trống. Tạo phiếu sửa chữa mới ở tab Phiếu sửa chữa.</div>';
    else h+='<div class="bays">'+cur.map(function(o){var v=veh(o.vehicleId);
      return '<div class="bay" data-act="open-order" data-id="'+o.id+'" tabindex="0" role="button"><div class="who">'+plate(v.plate)+' <b>'+esc(v.brand+' '+v.model)+'</b><span class="muted">'+esc(cust(v.customerId).name)+'</span></div>'+pill(o.status)+'</div>'}).join('')+'</div>';
    h+='</section><section class="panel"><h3>Doanh thu 6 tháng gần nhất (gồm VAT)</h3><div class="revbars">'+months.map(function(m){
      return '<div class="rb"><span class="val">'+(m.sum?new Intl.NumberFormat('vi-VN',{notation:'compact',maximumFractionDigits:1}).format(m.sum):'0')+'</span><div class="col" style="height:'+Math.round(m.sum/mx*110)+'px"></div><span class="mo">'+m.label+'</span></div>'}).join('')+'</div></section></div>';
    h+='<section class="panel"><h3>Cần nhập thêm</h3>';
    if(!low.length)h+='<div class="empty">Tồn kho đang đủ.</div>';
    else h+='<div class="tablebox" style="border:0"><table><thead><tr><th>Mã</th><th>Tên</th><th class="num">Tồn</th><th class="num">Tối thiểu</th></tr></thead><tbody>'+low.map(function(p){
      return '<tr><td>'+esc(p.sku)+'</td><td>'+esc(p.name)+'</td><td class="num"><span class="pill bad">'+p.stock+'</span></td><td class="num">'+p.min+'</td></tr>'}).join('')+'</tbody></table></div>';
    return h+'</section>';
  }

  function render(){
    renderTabs();
    var m=document.getElementById('main');
    var f={'tong-quan':rDash,phieu:view.orderId?rOrderDetail:rOrders,khach:rCust,xe:rVeh,kho:rParts,'hoa-don':view.orderId?rOrderDetail:rInvoices,prompt:rPrompt}[view.tab];
    m.innerHTML=f();
    fillAddline();
    var t=document.getElementById('al-type');if(t)t.addEventListener('change',fillAddline);
    var al=document.getElementById('addline');if(al)al.addEventListener('submit',addLine);
    var q=document.getElementById('q');
    if(q){q.addEventListener('input',function(){view.q=q.value;var pos=q.selectionStart;render();var n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}})}
  }

  /* ---------- actions ---------- */
  function addLine(e){
    e.preventDefault();
    var o=byId(S.orders,view.orderId);if(!o)return;
    var type=document.getElementById('al-type').value,id=document.getElementById('al-item').value,qty=parseInt(document.getElementById('al-qty').value,10);
    if(!(qty>0)){toast('Số lượng phải lớn hơn 0.');return}
    if(type==='part'){
      var p=byId(S.parts,id);
      if(!p)return;
      if(p.stock<qty){toast('Kho chỉ còn '+p.stock+' '+p.name+'.');return}
      p.stock-=qty;
      var ex=o.items.filter(function(i){return i.type==='part'&&i.refId===id})[0];
      if(ex)ex.qty+=qty;else o.items.push({id:uid(),type:'part',refId:id,name:p.name,qty:qty,price:p.price});
    }else{
      var s=byId(S.services,id);if(!s)return;
      var ex2=o.items.filter(function(i){return i.type==='service'&&i.refId===id})[0];
      if(ex2)ex2.qty+=qty;else o.items.push({id:uid(),type:'service',refId:id,name:s.name,qty:qty,price:s.price});
    }
    save();render();toast('Đã thêm vào phiếu.');
  }

  function nextCode(){
    var mx=S.orders.reduce(function(a,o){return Math.max(a,parseInt(o.code.split('-')[1],10)||0)},0);
    return 'PSC-'+String(mx+1).padStart(4,'0');
  }

    'open-order':function(el){view.orderId=el.dataset.id;if(view.tab==='tong-quan')view.tab='phieu';render();window.scrollTo(0,0)},
    back:function(){view.orderId=null;render()},
    advance:function(el){
      var o=byId(S.orders,el.dataset.id);if(!o)return;
      if(o.status==='hoanthanh'){
        if(!o.items.length){toast('Phiếu chưa có dòng nào để thanh toán.');return}
        o.status='dathanhtoan';o.paidAt=new Date().toISOString();toast('Đã thanh toán. Hóa đơn '+o.code.replace('PSC','HD')+' đã được tạo.');
      }else{
        var idx=STATUS.map(function(s){return s.k}).indexOf(o.status);o.status=STATUS[idx+1].k;toast('Trạng thái: '+st(o.status).t);
      }
      save();render();
    },
    'rm-item':function(el){
      var o=byId(S.orders,view.orderId);if(!o)return;
      var i=byId(o.items,el.dataset.id);if(!i)return;
      if(i.type==='part'){var p=byId(S.parts,i.refId);if(p)p.stock+=i.qty}
      o.items=o.items.filter(function(x){return x.id!==i.id});save();render();toast('Đã bỏ khỏi phiếu'+(i.type==='part'?' và hoàn lại kho.':'.'));
    },
    del:function(el){
      var kind=el.dataset.kind,id=el.dataset.id,key=kind+':'+id;
      if(pendingDel!==key){pendingDel=key;render();setTimeout(function(){if(pendingDel===key){pendingDel=null;render()}},3500);return}
      pendingDel=null;
      if(kind==='cust'){
        if(S.vehicles.some(function(v){return v.customerId===id})){toast('Khách hàng này còn xe. Hãy xóa hoặc chuyển xe trước.');render();return}
        S.customers=S.customers.filter(function(x){return x.id!==id});
      }else if(kind==='veh'){
        if(S.orders.some(function(o){return o.vehicleId===id})){toast('Xe này đã có phiếu sửa chữa nên không thể xóa.');render();return}
        S.vehicles=S.vehicles.filter(function(x){return x.id!==id});
      }else if(kind==='part'){
        S.parts=S.parts.filter(function(x){return x.id!==id});
      }
      save();render();toast('Đã xóa.');
    },
    'add-cust':function(){
      openModal('Thêm khách hàng',fld('name','Họ tên')+fld('phone','Số điện thoại',{type:'tel'})+fld('address','Địa chỉ',{req:false}),function(d){
        S.customers.push({id:uid(),name:d.name,phone:d.phone,address:d.address});save();render();toast('Đã thêm khách hàng.');
      });
    },
    'add-veh':function(){
      if(!S.customers.length){toast('Hãy thêm khách hàng trước.');return}
      openModal('Thêm xe',fld('plate','Biển số',{ph:'43A-123.45'})+'<div class="row2">'+fld('brand','Hãng',{ph:'Toyota'})+fld('model','Dòng xe',{ph:'Vios'})+'</div><div class="row2">'+fld('year','Năm sản xuất',{type:'number',min:1980,val:new Date().getFullYear()-3})+fld('km','Số km',{type:'number',min:0,val:0})+'</div>'+
        sel('customerId','Chủ xe',S.customers.map(function(c){return [c.id,c.name]})),function(d){
        var pl=d.plate.toUpperCase();
        if(S.vehicles.some(function(v){return v.plate.toUpperCase()===pl})){toast('Biển số '+pl+' đã có trong hệ thống.');return false}
        S.vehicles.push({id:uid(),plate:pl,brand:d.brand,model:d.model,year:parseInt(d.year,10),km:parseInt(d.km,10)||0,customerId:d.customerId});save();render();toast('Đã thêm xe.');
      });
    },
    'add-part':function(){
      openModal('Thêm phụ tùng',fld('sku','Mã phụ tùng')+fld('name','Tên phụ tùng')+'<div class="row2">'+fld('price','Đơn giá (₫)',{type:'number',min:0})+fld('stock','Tồn kho',{type:'number',min:0,val:0})+'</div>'+fld('min','Mức tồn tối thiểu',{type:'number',min:0,val:3}),function(d){
        if(S.parts.some(function(p){return p.sku.toLowerCase()===d.sku.toLowerCase()})){toast('Mã '+d.sku+' đã tồn tại.');return false}
        S.parts.push({id:uid(),sku:d.sku.toUpperCase(),name:d.name,price:parseInt(d.price,10)||0,stock:parseInt(d.stock,10)||0,min:parseInt(d.min,10)||0});save();render();toast('Đã thêm phụ tùng.');
      });
    },
    restock:function(el){
      var p=byId(S.parts,el.dataset.id);if(!p)return;
      openModal('Nhập thêm: '+p.name,fld('qty','Số lượng nhập',{type:'number',min:1,val:10}),function(d){
        var q=parseInt(d.qty,10);if(!(q>0)){toast('Số lượng phải lớn hơn 0.');return false}
        p.stock+=q;save();render();toast('Đã nhập '+q+' vào kho.');
      },'Nhập kho');
    },
    'add-order':function(){
      if(!S.vehicles.length){toast('Hãy thêm xe trước.');return}
      openModal('Tạo phiếu sửa chữa',sel('vehicleId','Xe',S.vehicles.map(function(v){return [v.id,v.plate+' · '+v.brand+' '+v.model+' · '+cust(v.customerId).name]}))+
        '<label for="f-desc">Tình trạng, yêu cầu của khách<textarea id="f-desc" name="desc" rows="3" required></textarea></label>'+
        sel('mechanic','Thợ phụ trách',MECH.map(function(m){return [m,m]})),function(d){
        var o={id:uid(),code:nextCode(),vehicleId:d.vehicleId,desc:d.desc,mechanic:d.mechanic,status:'tiepnhan',date:new Date().toISOString(),paidAt:null,items:[]};
        S.orders.push(o);save();view.tab='phieu';view.orderId=o.id;render();toast('Đã tạo phiếu '+o.code+'.');
      },'Tạo phiếu');
    },
    'copy-prompt':function(){
      var t=document.getElementById('prompt-text').textContent;
      var ok=function(){toast('Đã sao chép prompt.')};
      var fb=function(){var r=document.createRange();r.selectNodeContents(document.getElementById('prompt-text'));var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast('Đã chọn văn bản. Nhấn Ctrl+C để sao chép.')};
      try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}
    }
  };

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');
    if(!el){if(e.target.id==='modal')closeModal();return}
    var fn=actions[el.dataset.act];if(fn)fn(el);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape')closeModal();
    if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.bay[data-act]')){e.preventDefault();actions['open-order'](e.target)}
  });

  render();
})();
</script>
</body>
</html>
